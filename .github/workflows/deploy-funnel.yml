name: Sync Funnel to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Publish the waitlist only. A full replace of gh-pages drops
      # vault-access, variant-b, and the zip downloads on the next deploy.
      # Public: config.js and the homepage.
      # Not public: engine_state.json, AGENTS.md, AI_HANDOFF.md, marketing/,
      # controller/, scout/, creatives/, vault_product/, .cursor/, market intel.
      - name: Publish public funnel files only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/funnel"
          cp -f config.js "$STAGE/config.js"
          cp -f funnel/index.html "$STAGE/funnel/index.html"
          cp -f funnel/index.html "$STAGE/index.html"
          cp -f robots.txt "$STAGE/robots.txt"
          touch "$STAGE/.nojekyll"

          git fetch origin gh-pages
          git checkout gh-pages
          git rm -rf . >/dev/null
          git clean -fdx
          cp -a "$STAGE/." .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy(pages): publish public funnel files only"
            git push origin gh-pages
          fi
